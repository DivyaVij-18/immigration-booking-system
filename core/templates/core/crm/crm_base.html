{% extends "core/base.html" %}

{% block title %}
CRM Dashboard
{% endblock %}

{% block content %}

<div class="container-fluid pt-5 mt-5">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">

            <div class="list-group shadow sticky-top" style="top:100px;">

                <a href="{% url 'core:crm_dashboard' %}"
                   class="list-group-item list-group-item-action">
                    📊 Dashboard
                </a>

                <a href="{% url 'core:crm_customers' %}"
                   class="list-group-item list-group-item-action">
                    👤 Customers
                </a>

                <a href="{% url 'core:crm_bookings' %}"
                   class="list-group-item list-group-item-action">
                    📅 Bookings
                </a>

                <a href="{% url 'core:crm_payments' %}"
                   class="list-group-item list-group-item-action">
                    💳 Payments
                </a>

                <a href="{% url 'core:crm_reports' %}"
                   class="list-group-item list-group-item-action">
                    📈 Reports
                </a>

                <a href="{% url 'core:home' %}"
                   class="list-group-item list-group-item-action text-danger">
                    ← Back to Website
                </a>

            </div>

        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10">

            <h2 class="mb-4">
                {% block crm_title %}
                {% endblock %}
            </h2>

            {% block crm_content %}
            {% endblock %}

        </div>

    </div>

</div>

{% endblock %}
